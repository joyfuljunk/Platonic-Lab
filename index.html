<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⭐Platonic Lab⭐</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f6fa;
      color: #333;
    }

    header {
      background: #4a69bd;
      color: white;
      padding: 40px;
      text-align: center;
    }

    section {
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
    }

    .intro {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      text-decoration: none;
      color: #333;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: 0.2s;
    }

    .box:hover {
      transform: translateY(-5px);
      background: #4a69bd;
      color: white;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: gray;
    }

    @media (max-width: 600px) {
      .links {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>⭐Platonic Lab⭐</h1>
    <p></p>
  </header>

  <section>

     <div class="links">
      <a class="box" href="https://joyfuljunk.github.io/explore/" target="_blank">
        Explore Platonic Solids
      </a>

        <div class="dropdown">

            <div class="box">
                Quizzes
            </div>

            <div class="submenu">
                <a href="https://joyfuljunk.github.io/Quiz./" target="_blank">
                    Matching Names
                </a>

                <a href="https://joyfuljunk.github.io/Quiz/" target="_blank">
                    Matching Faces, Vertices, Edges
                </a>
            </div>

        </div>


      <a class="box" href="https://joyfuljunk.github.io/Platonic-Solid-Nets/" target="_blank">
        Platonic solid Nets
      </a>
    </div>

  </section>

  <footer>
    © 2026platoniclab
  </footer>

</body>
</html>
